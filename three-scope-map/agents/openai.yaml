interface:
  display_name: "Three Scope Map"
  short_description: "Build one-to-one dark HUD Three.js maps with drilldown and reusable geographic style"
  default_prompt: "Use this skill to build or migrate a Three.js 3D map from the bundled one-to-one smart-mine Vue template first. Preserve the validated dark HUD renderer, side-wall gradient, terrain textures, labels, scatter/ripple, fly lines, hover states, chase-light effects, camera controls, and drilldown behavior across world/country/province/city/district GeoJSON scopes."
